name: Build and Push to Azure Container Registry

on:
  workflow_call:
    inputs:
      registry:
        description: "Azure Container Registry name (e.g., myregistry.azurecr.io)"
        required: true
        type: string
      image_name:
        description: "Name of the container image"
        required: true
        type: string
      azure_client_id:
        description: "Azure AD application (client) ID for OIDC login"
        required: true
        type: string
      azure_tenant_id:
        description: "Azure AD tenant ID for OIDC login"
        required: true
        type: string
      azure_subscription_id:
        description: "Azure subscription ID"
        required: true
        type: string
      platforms:
        description: "Platforms to build for (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      run_dependency_review:
        description: "Whether to run dependency review on pull requests"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        if: github.event_name == 'pull_request' && inputs.run_dependency_review
        uses: actions/dependency-review-action@v4.7.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: List available Azure resources
        run: az resource list --output table

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ inputs.registry }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0.18.0
        with:
          image: ${{ inputs.registry }}/${{ inputs.image_name }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom.spdx.json
          output-file: /tmp/sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2.2.0
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: /tmp/sbom.spdx.json
          push-to-registry: true
