name: Deploy to AKS

on:
  workflow_call:
    inputs:
      registry:
        description: "Azure Container Registry name (e.g., myregistry.azurecr.io)"
        required: true
        type: string
      image_name:
        description: "Name of the container image"
        required: true
        type: string
      azure_client_id:
        description: "Azure AD application (client) ID for OIDC login"
        required: true
        type: string
      azure_tenant_id:
        description: "Azure AD tenant ID for OIDC login"
        required: true
        type: string
      azure_subscription_id:
        description: "Azure subscription ID"
        required: true
        type: string
      aks_resource_group:
        description: "Azure resource group containing the AKS cluster"
        required: true
        type: string
      aks_cluster_name:
        description: "Name of the AKS cluster"
        required: true
        type: string
      helm_chart_path:
        description: "Path to the Helm chart directory"
        required: false
        type: string
        default: "./helm/secure-chainz"
      helm_release_name:
        description: "Helm release name"
        required: false
        type: string
        default: "secure-chainz"
      head_sha:
        description: "The commit SHA from the triggering workflow run (used to derive the image tag)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  deployments: write
  artifact-metadata: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image reference
        id: image
        run: |
          SHORT_SHA="${{ inputs.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          IMAGE_REF="${{ inputs.registry }}/${{ inputs.image_name }}:main-${SHORT_SHA}"
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ inputs.registry }}

      - name: Verify image attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attestations are created by build-and-push.yml in the reusable-workflows repo.
          # In a reusable workflow, github.workflow_ref reflects the CALLING workflow's ref,
          # not this reusable workflow's ref. The cert SAN is always:
          # https://github.com/oodles-noodles/reusable-workflows/.github/workflows/build-and-push.yml@<ref>
          # --repo uses the calling repo, as that is what the OIDC token is scoped to.
          gh attestation verify "oci://${{ steps.image.outputs.ref }}" \
            --repo "${{ github.repository }}" \
            --cert-identity-regex "https://github.com/oodles-noodles/reusable-workflows/.github/workflows/build-and-push.yml@.*"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: azure/setup-kubectl@v4

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.24'

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ inputs.aks_resource_group }}
          cluster-name: ${{ inputs.aks_cluster_name }}

      - name: Deploy with Helm
        run: |
          kubelogin convert-kubeconfig -l azurecli
          helm upgrade --install ${{ inputs.helm_release_name }} ${{ inputs.helm_chart_path }} \
            --set image.repository="${{ inputs.registry }}/${{ inputs.image_name }}" \
            --set image.tag="${{ steps.image.outputs.tag }}" \
            --wait

      - name: Create artifact deployment record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIGEST=$(az acr repository show \
            --name "${{ inputs.registry }}" \
            --image "${{ inputs.image_name }}:${{ steps.image.outputs.tag }}" \
            --query digest -o tsv)
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/artifacts/metadata/deployment-record" \
            -d "{\"name\":\"${{ inputs.image_name }}\",\"digest\":\"${DIGEST}\",\"status\":\"deployed\",\"logical_environment\":\"prod\",\"cluster\":\"${{ inputs.aks_cluster_name }}\",\"deployment_name\":{\"name\":\"${{ inputs.image_name }}\"}}"
